<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deer Tick Society</title>
<meta name="description" content="Deer Tick Society: a lifestyle and clothing brand. Join the society for first access to drops, events and news.">
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Deer Tick Society">
<meta property="og:description" content="Deer Tick Society: a lifestyle and clothing brand. Join the society for first access to drops, events and news.">
<meta property="og:image" content="https://deerticksociety.com/logo.png">
<meta property="og:url" content="https://deerticksociety.com/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600&family=Fraunces:wght@800&family=Lora:wght@400;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: Lora, Georgia, serif; color: #000; background: #fff; line-height: 1.6; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #8a8a8a; outline-offset: 3px; }

  .hero { background: #000; color: #fff; }
  .hero-inner {
    max-width: 1120px; margin: 0 auto;
    padding: clamp(56px, 9vw, 112px) 24px clamp(80px, 12vw, 144px);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  /* Logo and title share one width: the title sets it, the logo fills it. */
  .lockup { width: fit-content; max-width: 100%; display: flex; flex-direction: column; align-items: stretch; }
  .lockup img {
    display: block; width: 0; min-width: 100%; height: auto;
    filter: drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff);
  }
  .lockup h1 {
    margin: clamp(12px, 2vw, 24px) 0 0; white-space: nowrap;
    font-family: 'Bebas Neue', sans-serif; font-weight: 400;
    font-size: clamp(40px, 13.5vw, 124px); line-height: 1.1; letter-spacing: 0;
    color: #fff; -webkit-font-smoothing: antialiased;
  }

  .join { background: #F2F2F2; }
  .join-inner {
    max-width: 720px; margin: 0 auto; padding: 80px 24px;
    display: flex; flex-direction: column; gap: 20px; text-align: center; align-items: center;
  }
  .join h2 { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 40px; }
  .join p { margin: 0; font-size: 18px; }
  .join form { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .join input {
    width: 100%; max-width: 360px; padding: 14px 16px; font-size: 16px;
    border: 2px solid #000; border-radius: 4px; background: #fff; font-family: Lora, Georgia, serif;
  }
  .join button {
    width: 144px; height: 51px; padding: 14px 28px; border: 0; border-radius: 4px; cursor: pointer;
    background: #000; color: #fff;
    font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .join button:hover { opacity: .88; }

  footer { background: #000; color: #D4D4D4; }
  .footer-inner {
    max-width: 1120px; margin: 0 auto; padding: 32px 24px;
    display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; font-size: 14px;
  }
  .ig {
    display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none;
    font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 14px; letter-spacing: 0.04em;
  }
  .ig:hover { opacity: .88; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="lockup">
      <img src="logo.png" alt="Deer Tick Society tick logo" width="904" height="797">
      <h1>Deer Tick Society</h1>
    </div>
  </div>
</header>

<main>
  <section class="join" id="join">
    <div class="join-inner">
      <h2>Join the Society</h2>
      <p>Get first access to drops, events and news.</p>
      <form onsubmit="return false">
        <label for="email" class="sr-only">Email address</label>
        <input id="email" type="email" placeholder="you@email.com" required>
        <button type="submit">Sign Up</button>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <div>Deer Tick Society</div>
    <a class="ig" href="https://www.instagram.com/deertick_society" target="_blank" rel="noopener" aria-label="Deer Tick Society on Instagram">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="#FFFFFF" stroke="none"></circle></svg>@deertick_society
    </a>
  </div>
</footer>
</body>
</html>
