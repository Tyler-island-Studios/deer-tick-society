<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deer Tick Society</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&amp;family=Playfair+Display:wght@600;800&amp;family=Lora:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
a.btn:hover{opacity:.88}
</style>
</head>
<body>

<div style="font-family: Lora, Georgia, serif; color: #000000; background: #FFFFFF; line-height: 1.6">
<div style="background: #000000; color: #FFFFFF">
<div style="max-width: 1120px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 12px; font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 34px"><img src="logo.png" alt="" style="width: 44px; height: 44px; object-fit: contain; filter: invert(1)">Deer Tick Society</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; font-size: 15px">
<a href="#gear">Gear</a>
<a href="#join">Join</a>
</div>
</div>
<div style="max-width: 1120px; margin: 0 auto; padding: 72px 24px 96px; display: flex; flex-direction: column; gap: 24px; align-items: center; text-align: center">
<img src="logo.png" alt="Deer Tick Society tick logo" style="width: 520px; max-width: 90%; height: auto; object-fit: contain; filter: invert(1)">
<h1 style="margin: -32px 0 0; font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 132px; line-height: 1.2; letter-spacing: 0.01em; max-width: 1000px; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; color: #FFFFFF; position: static">Deer Tick Society</h1>
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: center">
<a class="btn" href="#join" style="background: #FFFFFF; color: #000000; padding: 14px 28px; text-decoration: none; font-weight: 600; border-radius: 4px">Join the Society</a>
<a class="btn" href="#gear" style="border: 2px solid #FFFFFF; color: #FFFFFF; padding: 12px 26px; text-decoration: none; font-weight: 600; border-radius: 4px">Shop Gear</a>
</div>
</div>
</div>

<div id="join" style="max-width: 720px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 20px; text-align: center; align-items: center">
<h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 40px">Join the Society</h2>
<p style="margin: 0; font-size: 18px">Get first access to drops, events and news.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%">
<label for="email" style="position: absolute; left: -9999px">Email address</label>
<input id="email" type="email" placeholder="you@email.com" style="flex: 1 1 260px; max-width: 360px; padding: 14px 16px; font-size: 16px; border: 2px solid #000000; border-radius: 4px; background: #FFFFFF; font-family: Lora, Georgia, serif">
<button style="padding: 14px 28px; font-size: 16px; font-weight: 600; background: #000000; color: #FFFFFF; border: 0; border-radius: 4px; cursor: pointer">Sign Up</button>
</div>
</div>
<div style="background: #000000; color: #D4D4D4">
<div style="max-width: 1120px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-size: 14px">
<div>Deer Tick Society</div>
<a class="btn" href="https://www.instagram.com/deertick_society" target="_blank" rel="noopener" aria-label="Deer Tick Society on Instagram" style="display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none; font-weight: 600; letter-spacing: 0.04em"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="#FFFFFF" stroke="none"></circle></svg>@deertick_society</a>
</div>
</div>
</div>

</body>
</html>
